project: Tinycast.xcodeproj
schemes:
  - Tinycast

# Equatable/Hashable and Codable synthesize methods that read every stored
# property. Periphery cannot see those compiler-synthesized reads, so these
# flags retain properties on types conforming to either protocol.
retain_equatable_properties: true
retain_codable_properties: true

# EdgeDissolve and ThinScrollbar are off-limits per AGENTS.md. Generated data
# is also never hand-edited. Tools contains standalone harnesses outside the
# Xcode target, so exclude it just as .swiftlint.yml does.
report_exclude:
  - Tinycast/DesignSystem/Scrolling/EdgeDissolve.swift
  - Tinycast/DesignSystem/Scrolling/ThinScrollbar.swift
  - Tinycast/Features/Emoji/Model/EmojiData.generated.swift
  - Tinycast/Features/Calculator/Model/CurrencyData.generated.swift
  - Tools
