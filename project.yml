name: Tinycast
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.4.5"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable identity preserves Accessibility grants; see docs/signing.md.
    CODE_SIGN_IDENTITY: "Tinycast Self-Signed"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # Strip after dSYM generation and remove dead code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.0.0"

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
    dependencies:
      - package: MarkdownUI
      - target: TinycastTrashHelper
        embed: false
    postBuildScripts:
      - name: Embed Administrator Trash Helper
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/TinycastTrashHelper"
          cp -f "$BUILT_PRODUCTS_DIR/TinycastTrashHelper" "$destination"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/TinycastTrashHelper"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/TinycastTrashHelper"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinycast.app
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinycast/Tinycast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Keep local Debug state isolated from installed channels.
        Debug:
          PRODUCT_NAME: Tinycast Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.tinycast.app.dev

  TinycastTrashHelper:
    type: tool
    platform: macOS
    sources:
      - path: TinycastTrashHelper
      - path: Tinycast/Features/Uninstall/Model/AdministratorTrashPolicy.swift
      - path: Tinycast/Features/Uninstall/Model/UninstallSearchRoot.swift
      - path: Tinycast/Features/Uninstall/Service/AdminTrashProtocol.swift
    settings:
      base:
        PRODUCT_NAME: TinycastTrashHelper
        SKIP_INSTALL: "YES"
