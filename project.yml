name: Tinycast
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  # Vendored (see third-party/KeyboardShortcuts) to patch resource-bundle resolution. Kept in sync
  # with Package.swift per the two-project-definitions note in CLAUDE.md.
  KeyboardShortcuts:
    path: third-party/KeyboardShortcuts

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinycast.app
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinycast/Tinycast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
