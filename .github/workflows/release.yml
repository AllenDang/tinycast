name: Release

# Shown in the Actions list instead of a bare "Release" — carries the version + channel.
run-name: "Tinycast ${{ inputs.version }} · ${{ inputs.channel }} #${{ github.run_number }}"

# Manually triggered from the Actions tab. Pick a channel and a base version;
# alpha/beta builds get an auto-incrementing suffix so re-running never collides.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [alpha, beta, stable]
        default: alpha
      version:
        description: "Base version, e.g. 0.2.0 (no channel suffix)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          BASE_VERSION="${{ github.event.inputs.version }}"
          # Each channel is a distinct, side-by-side app: its own display name + bundle id,
          # and its own Homebrew cask in the abue-ammar/homebrew-tinycast tap.
          case "$CHANNEL" in
            alpha)  SUFFIX="-alpha.${GITHUB_RUN_NUMBER}"; DISPLAY="Tinycast Alpha"; BUNDLE="com.tinycast.app.alpha"; CASK="tinycast@alpha"; PRERELEASE=true ;;
            beta)   SUFFIX="-beta.${GITHUB_RUN_NUMBER}";  DISPLAY="Tinycast Beta";  BUNDLE="com.tinycast.app.beta";  CASK="tinycast@beta";  PRERELEASE=true ;;
            stable) SUFFIX="";                            DISPLAY="Tinycast";       BUNDLE="com.tinycast.app";       CASK="tinycast";       PRERELEASE=false ;;
          esac
          FULL="${BASE_VERSION}${SUFFIX}"
          {
            echo "full_version=${FULL}"
            echo "display_name=${DISPLAY}"
            echo "bundle_id=${BUNDLE}"
            echo "cask_name=${CASK}"
            echo "dmg_file=Tinycast-${FULL}.dmg"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      # Import the stable self-signed identity so every release is signed with the SAME cert.
      # This is what keeps users' Accessibility (TCC) grant alive across updates — without it
      # make-app.sh ad-hoc signs, changing the code signature (and breaking the grant) each build.
      # Generate the secrets with Packaging/export-signing-cert.sh.
      - name: Import signing certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "${P12_BASE64}" ]; then
            echo "::warning::SIGNING_P12_BASE64 not set — falling back to ad-hoc signing. Users' Accessibility grant will NOT survive updates until this secret is added (see Packaging/export-signing-cert.sh)."
            echo "strict=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so `security find-identity` (in make-app.sh) sees it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "strict=1" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          BUILD_NUMBER: ${{ github.run_number }}
          DMG_BASE: Tinycast
          STRICT_SIGN: ${{ steps.signing.outputs.strict }}
        run: Packaging/build-dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-${{ steps.meta.outputs.full_version }}
          path: build/${{ steps.meta.outputs.dmg_file }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.full_version }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            "build/${{ steps.meta.outputs.dmg_file }}" \
            --title "${{ steps.meta.outputs.display_name }} ${{ steps.meta.outputs.full_version }}" \
            --notes "**Channel:** ${{ github.event.inputs.channel }}
          **Version:** ${{ steps.meta.outputs.full_version }}
          **Bundle ID:** \`${{ steps.meta.outputs.bundle_id }}\`
          Built from ${{ github.sha }}.

          **Recommended:** install via Homebrew — it clears the quarantine flag automatically on every install and update, so there's nothing to run by hand:
          \`\`\`sh
          brew install --cask abue-ammar/tinycast/${{ steps.meta.outputs.cask_name }}
          \`\`\`
          This build is signed with a stable self-signed identity (**not** an Apple Developer ID, and not notarized — this project has no paid Apple account). If you download the DMG directly instead of using Homebrew, macOS will refuse to open it until you clear the quarantine flag once:
          \`\`\`sh
          xattr -dr com.apple.quarantine \"/Applications/${{ steps.meta.outputs.display_name }}.app\"
          \`\`\`" \
            $PRERELEASE_FLAG

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask bump. Add it to enable auto-updates of the tap."
            exit 0
          fi
          SHA="$(shasum -a 256 "build/${DMG_FILE}" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/abue-ammar/homebrew-tinycast.git" tap
          CASK_FILE="tap/Casks/${CASK}.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap."
            exit 1
          fi
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "${CASK} ${VERSION}"
            git push
          fi
